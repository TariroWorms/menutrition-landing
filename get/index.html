<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Me Nutrition — get the app</title>
<link rel="canonical" href="https://menutrition.app/app/">
<!-- QR codes on the site point here: iPhone/iPad go to the App Store, Android to Google Play, anything else to /app/.
     ?ct=<token> is passed on as the App Store campaign token and the Google Play utm_campaign. -->
<script>
(function(){
  var ua = navigator.userAgent || '';
  var m = /[?&]ct=([A-Za-z0-9_-]{1,60})/.exec(location.search);
  var ct = m ? m[1] : 'get';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var url = /Android/i.test(ua)
    ? 'https://play.google.com/store/apps/details?id=com.menutrition.scan&referrer=' + encodeURIComponent('utm_source=menutrition.app&utm_medium=qr&utm_campaign=' + ct)
    : ios ? 'https://apps.apple.com/app/id6767123368?pt=128869855&ct=' + ct + '&mt=8'
    : '/app/';
  location.replace(url);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2EFE8;color:#272320;font-family:system-ui,-apple-system,sans-serif;text-align:center}
.stores{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.stores a{display:block;line-height:0}.stores img{height:52px;width:auto}
.gp{position:relative;height:52px;aspect-ratio:564/168;overflow:hidden;border-radius:9px}
.gp img{position:absolute;top:-24.4%;left:-7.27%;height:148.81%;max-width:none}
</style>
</head>
<body>
<main>
<h1 style="font-size:22px;margin:0">Me Nutrition</h1>
<div class="stores">
<a href="https://apps.apple.com/app/id6767123368?pt=128869855&amp;ct=get-page&amp;mt=8"><img src="/badges/app-store-badge.svg" alt="Download on the App Store" width="156" height="52"></a>
<a class="gp" href="https://play.google.com/store/apps/details?id=com.menutrition.scan&amp;referrer=utm_source%3Dmenutrition.app%26utm_medium%3Dqr%26utm_campaign%3Dget-page"><img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" width="646" height="250"></a>
</div>
</main>
</body>
</html>
