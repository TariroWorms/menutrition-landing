<!DOCTYPE html>
<!-- Dish index template (/dishes/, /ru/dishes/ …). Styles come from template.html. -->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8" />
<meta name="apple-itunes-app" content="app-id=6767123368, affiliate-data=pt=128869855&amp;ct=banner-dishes" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}} — Me Nutrition</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{url}}" />
{{hreflang}}
<link rel="icon" type="image/png" href="/appicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
{{style}}
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{{home}}"><img src="/appicon.png" alt="" width="32" height="32"><span class="bn"><span class="me">Me</span><span class="bn-gap"> </span><span class="nu">Nutrition</span></span></a>
  <nav class="hnav">{{langmenu}}
  <a class="dl" href="https://apps.apple.com/app/id6767123368?pt=128869855&amp;ct=dishes-hdr-{{lang}}&amp;mt=8" target="_blank" rel="noopener">{{ui.download}}</a></nav>
</div></header>
{{sitenav}}
<main class="wrap">
  <nav class="crumbs"><a href="{{home}}">{{ui.home}}</a> › {{crumb}}</nav>
  <h1>{{ui.index_h}}</h1>
  <p class="intro">{{ui.index_p}}</p>
  <nav class="countries explore">{{explore}}</nav>
  <input class="search" id="q" type="search" placeholder="{{ui.search_ph}}" aria-label="{{ui.search_ph}}" autocomplete="off">
  <nav class="countries" id="countries">{{countries}}</nav>
  <div class="related" id="res" style="margin-top:18px" hidden data-base="{{index}}" data-u="{{ui.kcal}} / 100 {{ui.g}}"></div>
  {{groups}}
  <p class="empty" id="empty" hidden>{{ui.search_none}}</p>
  <p class="disclaimer">{{ui.disclaimer}} {{method}}</p>
</main>
<footer><div class="wrap">
  <a href="{{home}}">{{ui.home}}</a><a href="/privacy">{{ui.privacy}}</a><a href="/terms">{{ui.terms}}</a>
  <span class="langs">{{langs}}</span>
  <p class="cite">{{cite}}</p>
</div></footer>
<script>
(function(){
  var q=document.getElementById('q'),empty=document.getElementById('empty'),nav=document.getElementById('countries'),res=document.getElementById('res');
  if(!q) return;
  var norm=function(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u064b-\u0652]/g,'')};
  var rows=null,pending=null,esc=function(t){return t.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var groups=function(){return [].slice.call(document.querySelectorAll('.group'))};
  function load(){
    if(!pending) pending=fetch('/dishes/find-{{findlang}}.json').then(function(r){return r.json()}).then(function(j){rows=j.map(function(x){return {x:x,t:norm(x[1]+' '+x[3])}});return rows}).catch(function(){pending=null;return []});
    return pending;
  }
  function run(){
    var v=norm(q.value.trim());
    if(!v){res.hidden=true;res.innerHTML='';groups().forEach(function(g){g.hidden=false});nav.hidden=false;empty.hidden=true;return}
    load().then(function(){
      if(norm(q.value.trim())!==v) return;
      var out=[];for(var i=0;i<rows.length&&out.length<120;i++){if(rows[i].t.indexOf(v)>=0)out.push(rows[i].x)}
      res.innerHTML=out.map(function(x){return '<a href="'+res.dataset.base+x[0]+'/"><div>'+esc(x[1])+'<span>'+x[2]+' '+esc(res.dataset.u)+'</span></div></a>'}).join('');
      res.hidden=!out.length;groups().forEach(function(g){g.hidden=true});nav.hidden=true;empty.hidden=!!out.length;
    });
  }
  q.addEventListener('input',run);
  ['focus','pointerenter','touchstart'].forEach(function(e){q.addEventListener(e,function(){load()},{once:true,passive:true})});
})();
</script>
<script>document.addEventListener("click",function(e){document.querySelectorAll(".langbox").forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false})});</script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "dab6447bdaac4f67b7e2016c2698b9dd"}'></script><!-- End Cloudflare Web Analytics --><script defer src="/android.js"></script>
</body>
</html>
