<!DOCTYPE html>
<!-- Dish index template (/dishes/, /ru/dishes/ …). Styles come from template.html. -->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}} — Me Nutrition</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{url}}" />
{{hreflang}}
<link rel="icon" type="image/png" href="/appicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
{{style}}
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="{{home}}"><img src="/appicon.png" alt="" width="32" height="32"><span class="bn"><span class="me">Me</span><span class="bn-gap"> </span><span class="nu">Nutrition</span></span></a>
  <a class="dl" href="https://apps.apple.com/app/id6767123368" target="_blank" rel="noopener">{{ui.download}}</a>
</div></header>
<main class="wrap">
  <nav class="crumbs"><a href="{{home}}">{{ui.home}}</a> › {{ui.dishes}}</nav>
  <h1>{{ui.index_h}}</h1>
  <p class="intro">{{ui.index_p}}</p>
  <section><div class="related">{{cards}}</div></section>
  <p class="disclaimer">{{ui.disclaimer}}</p>
</main>
<footer><div class="wrap">
  <a href="{{home}}">{{ui.home}}</a><a href="/privacy">{{ui.privacy}}</a><a href="/terms">{{ui.terms}}</a>
  <span class="langs">{{langs}}</span>
</div></footer>
</body>
</html>
