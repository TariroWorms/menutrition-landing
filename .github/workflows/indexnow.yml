# After every push to main, tell Bing/Yandex (IndexNow) which pages changed.
# The site deploys from main on DigitalOcean; we wait for the deploy before pinging.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**/index.html', 'sitemap*.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL from the sitemaps'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the DigitalOcean deploy
        if: github.event_name == 'push'
        run: sleep 900
      - name: Submit changed URLs
        env:
          KEY: 85b8e1bb567fa1597709faf34d360d4a
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          site = 'https://menutrition.app'
          if os.environ.get('ALL') == 'true' or not os.environ.get('BEFORE') or set(os.environ['BEFORE']) == {'0'}:
              urls = [u for f in ('sitemap.xml', 'sitemap-dishes.xml') for u in re.findall(r'<loc>([^<]+)</loc>', open(f).read())]
          else:
              files = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', os.environ['BEFORE'], 'HEAD'],
                                     capture_output=True, text=True).stdout.split()
              urls = [site + '/' + (f[:-len('index.html')]) for f in files if f.endswith('index.html')]
          urls = sorted(set(urls))
          print(len(urls), 'URLs')
          for i in range(0, len(urls), 10000):
              body = json.dumps({'host': 'menutrition.app', 'key': os.environ['KEY'],
                                 'keyLocation': f"{site}/{os.environ['KEY']}.txt", 'urlList': urls[i:i + 10000]}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                           headers={'Content-Type': 'application/json; charset=utf-8'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('IndexNow:', r.status)
          PY
