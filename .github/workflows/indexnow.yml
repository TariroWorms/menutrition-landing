# After every push to main, tell Bing/Yandex (IndexNow) which pages changed.
# The site deploys from main on DigitalOcean; we wait for the deploy before pinging.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**/index.html', 'sitemap*.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL from the sitemaps'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the DigitalOcean deploy
        if: github.event_name == 'push'
        run: sleep 900
      - name: Wait until the key file is live
        env:
          KEY: 85b8e1bb567fa1597709faf34d360d4a
        run: |
          for i in $(seq 1 30); do
            body=$(curl -s -L -w '\n%{http_code} %{content_type}' "https://menutrition.app/$KEY.txt" || true)
            echo "try $i: $(echo "$body" | tail -1) | $(echo "$body" | head -1 | head -c 60)"
            if [ "$(echo "$body" | head -1)" = "$KEY" ]; then exit 0; fi
            sleep 30
          done
          echo "key file is not served at https://menutrition.app/$KEY.txt"; exit 1
      - name: Submit changed URLs
        env:
          KEY: 85b8e1bb567fa1597709faf34d360d4a
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          site = 'https://menutrition.app'
          if os.environ.get('ALL') == 'true' or not os.environ.get('BEFORE') or set(os.environ['BEFORE']) == {'0'}:
              urls = [u for f in ('sitemap.xml', 'sitemap-dishes.xml', 'sitemap-features.xml', 'sitemap-calculators.xml', 'sitemap-foods-en.xml', 'sitemap-foods-ru.xml', 'sitemap-foods-ar.xml', 'sitemap-foods-it.xml', 'sitemap-foods-el.xml', 'sitemap-foods-es.xml', 'sitemap-foods-de.xml') for u in re.findall(r'<loc>([^<]+)</loc>', open(f).read())]
          else:
              # the checkout is shallow: fetch the commit the push started from, so the diff covers every pushed commit
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', os.environ['BEFORE']], check=False)
              diff = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', os.environ['BEFORE'], 'HEAD'],
                                    capture_output=True, text=True)
              if diff.returncode != 0:   # cannot compare: send everything rather than nothing
                  print('git diff failed:', diff.stderr.strip())
                  urls = [u for f in ('sitemap.xml', 'sitemap-dishes.xml', 'sitemap-features.xml', 'sitemap-calculators.xml', 'sitemap-foods-en.xml', 'sitemap-foods-ru.xml', 'sitemap-foods-ar.xml', 'sitemap-foods-it.xml', 'sitemap-foods-el.xml', 'sitemap-foods-es.xml', 'sitemap-foods-de.xml') for u in re.findall(r'<loc>([^<]+)</loc>', open(f).read())]
              else:
                  urls = [site + '/' + (f[:-len('index.html')]) for f in diff.stdout.split() if f.endswith('index.html')]
          urls = sorted(set(urls))
          print(len(urls), 'URLs')
          for i in range(0, len(urls), 10000):
              body = json.dumps({'host': 'menutrition.app', 'key': os.environ['KEY'],
                                 'keyLocation': f"{site}/{os.environ['KEY']}.txt", 'urlList': urls[i:i + 10000]}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                           headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print('IndexNow:', r.status, r.read()[:300])
              except urllib.error.HTTPError as e:
                  print('IndexNow error:', e.code, e.read()[:500]); raise
          PY
