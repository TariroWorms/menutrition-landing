# After every push to main, tell Bing/Yandex (IndexNow) which pages changed.
# The site deploys from main on DigitalOcean (15-30 min); we poll the live site until the pushed pages appear, then ping.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**/index.html', 'sitemap*.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL from the sitemaps'
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait until the pushed pages are live
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The deploy takes 15-30 minutes. Instead of sleeping a fixed time, poll a sample of the pushed files
          # on the live site until each one is byte-identical to the file in this checkout (up to 100 minutes).
          python3 - <<'PY'
          import hashlib, os, subprocess, sys, time, urllib.request
          site = 'https://menutrition.app'
          before = os.environ.get('BEFORE', '')
          files = []
          if before and set(before) != {'0'}:
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', before], check=False)
              d = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', before, 'HEAD'], capture_output=True, text=True)
              if d.returncode == 0:
                  files = [f for f in d.stdout.split() if f.endswith('index.html') or f.startswith('sitemap') or f == 'robots.txt']
          # Cloudflare rewrites e-mail addresses on the fly (the home pages), so those pages never match byte for byte: sample the rest
          def has_email(f):
              try:
                  return 'mailto:' in open(f, encoding='utf-8', errors='ignore').read()
              except OSError:
                  return True
          files = [f for f in files if not has_email(f)]
          if not files:
              print('no comparable page in this push: waiting 20 minutes instead')
              time.sleep(1200)
              sys.exit(0)
          step = max(1, len(files) // 6)
          sample = sorted(set(files[::step][:5] + [files[-1]]))
          def url(f):
              return site + '/' + (f[:-len('index.html')] if f.endswith('index.html') else f)
          want = {f: hashlib.sha256(open(f, 'rb').read()).hexdigest() for f in sample}
          print(len(files), 'changed files; waiting for', sample)
          for i in range(200):
              pending = []
              for f in sample:
                  try:
                      with urllib.request.urlopen(url(f), timeout=30) as r:
                          ok = hashlib.sha256(r.read()).hexdigest() == want[f]
                  except Exception as e:
                      ok = False
                  if not ok:
                      pending.append(f)
              if not pending:
                  print('deploy is live after', i * 30 // 60, 'min')
                  sys.exit(0)
              print(f'try {i}: not live yet: {pending[:3]}')
              time.sleep(30)
          print('the pushed pages did not appear on the live site within 100 minutes; not submitting'); sys.exit(1)
          PY
      - name: Wait until the key file is live
        env:
          KEY: 85b8e1bb567fa1597709faf34d360d4a
        run: |
          for i in $(seq 1 30); do
            body=$(curl -s -L -w '\n%{http_code} %{content_type}' "https://menutrition.app/$KEY.txt" || true)
            echo "try $i: $(echo "$body" | tail -1) | $(echo "$body" | head -1 | head -c 60)"
            if [ "$(echo "$body" | head -1)" = "$KEY" ]; then exit 0; fi
            sleep 30
          done
          echo "key file is not served at https://menutrition.app/$KEY.txt"; exit 1
      - name: Submit changed URLs
        env:
          KEY: 85b8e1bb567fa1597709faf34d360d4a
          ALL: ${{ inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          site = 'https://menutrition.app'
          if os.environ.get('ALL') == 'true' or not os.environ.get('BEFORE') or set(os.environ['BEFORE']) == {'0'}:
              urls = [u for f in ('sitemap.xml', 'sitemap-dishes.xml', 'sitemap-features.xml', 'sitemap-calculators.xml', 'sitemap-foods-en.xml', 'sitemap-foods-ru.xml', 'sitemap-foods-ar.xml', 'sitemap-foods-it.xml', 'sitemap-foods-el.xml', 'sitemap-foods-es.xml', 'sitemap-foods-de.xml') for u in re.findall(r'<loc>([^<]+)</loc>', open(f).read())]
          else:
              # the checkout is shallow: fetch the commit the push started from, so the diff covers every pushed commit
              subprocess.run(['git', 'fetch', '--depth=1', 'origin', os.environ['BEFORE']], check=False)
              diff = subprocess.run(['git', 'diff', '--name-only', '--diff-filter=AM', os.environ['BEFORE'], 'HEAD'],
                                    capture_output=True, text=True)
              if diff.returncode != 0:   # cannot compare: send everything rather than nothing
                  print('git diff failed:', diff.stderr.strip())
                  urls = [u for f in ('sitemap.xml', 'sitemap-dishes.xml', 'sitemap-features.xml', 'sitemap-calculators.xml', 'sitemap-foods-en.xml', 'sitemap-foods-ru.xml', 'sitemap-foods-ar.xml', 'sitemap-foods-it.xml', 'sitemap-foods-el.xml', 'sitemap-foods-es.xml', 'sitemap-foods-de.xml') for u in re.findall(r'<loc>([^<]+)</loc>', open(f).read())]
              else:
                  urls = [site + '/' + (f[:-len('index.html')]) for f in diff.stdout.split() if f.endswith('index.html')]
          urls = sorted(set(urls))
          print(len(urls), 'URLs')
          for i in range(0, len(urls), 10000):
              body = json.dumps({'host': 'menutrition.app', 'key': os.environ['KEY'],
                                 'keyLocation': f"{site}/{os.environ['KEY']}.txt", 'urlList': urls[i:i + 10000]}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                           headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print('IndexNow:', r.status, r.read()[:300])
              except urllib.error.HTTPError as e:
                  print('IndexNow error:', e.code, e.read()[:500]); raise
          PY
